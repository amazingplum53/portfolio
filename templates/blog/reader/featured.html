{% extends "blog/reader/base.html" %}

{% block header %}Featured{% endblock %}

{% block content %}

{% for article in articles %}

  <a href = "/blog/article/{{ article.id }}">
    <h2>
      {{ article.title }}
    </h2>
    <p>
      <i>{{ article.release_date }}</i>
    </p>
    <p>
      {{ article.get_first_paragraph }}
    </p>
  </a>

{% endfor %}

{% endblock %}
