
apiVersion: apps/v1
kind: Deployment
metadata:
  name: http
  labels: 
    app: http
spec:
  replicas: 1
  selector:
    matchLabels:
      app: http
  template:
    metadata:
      labels:
        app: http
    spec:
      containers:
      - name: http
        image: amazingplum/http-portfolio:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 80
          protocol: TCP
