apiVersion: apps/v1
kind: Deployment
metadata:
  name: gunicorn
  labels: 
    app: gunicorn
spec:
  replicas: 1
  selector:
    matchLabels:
      app: gunicorn
  template:
    metadata:
      labels:
        app: gunicorn
    spec:
      serviceAccountName: readonly
      containers:
      - name: gunicorn
        image: amazingplum/gunicorn-portfolio:latest
        imagePullPolicy: Always
        ports:
        - containerPort: 8001
          protocol: TCP
        volumeMounts:
        - name: secret
          mountPath: /var/secrets/environ
      volumes:
      - name: secret
        secret:
          secretName: env-file
